[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-probe"
version = "0.1.0"
description = "Deterministic webhook delivery fault scenarios with optional receiver-state assertions"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Serkan Esen"}]
dependencies = []

[project.scripts]
delivery-probe = "delivery_probe.cli:main"

[tool.setuptools.packages.find]
include = ["delivery_probe*"]
